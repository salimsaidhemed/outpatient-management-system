services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admissions
      POSTGRES_USER: admissions
      POSTGRES_PASSWORD: admissions
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admissions -d admissions"]
      interval: 5s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://admissions:admissions@db:5432/admissions
      CORS_ORIGINS: http://localhost:5173
      KEYCLOAK_ISSUER: http://localhost:8080/realms/outpatient
      KEYCLOAK_JWKS_URL: http://keycloak:8080/realms/outpatient/protocol/openid-connect/certs
      KEYCLOAK_CLIENT_ID: admissions-frontend
    ports:
      - "5050:5000"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
    volumes:
      - ./backend:/app
    command: flask --app app run --host 0.0.0.0 --port 5000 --debug

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_URL: http://localhost:5050/api
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: outpatient
      VITE_KEYCLOAK_CLIENT_ID: admissions-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro

volumes:
  postgres_data:
